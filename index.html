<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>">    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수업 자료 모음</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-area"></div>
    <!-- 1. 메인 배너 -->
    <div class="hero">
        <h1>수업 자료 모음💻</h1>
    </div>

    <!-- 2. 과목 카드 섹션 -->
    <div class="container">
        <div class="card-grid">
            
            <!-- 카드 1: 정보 -->
            <a href="https://comedu-by-y.github.io/study/2level-정보.html" target="_top" class="subject-card">
                <div class="card-header">
                    <div class="card-icon">🖥️</div>
                    <h2 class="card-title">정보</h2>
                </div>
                <p class="card-desc">교과서: 2022개정 삼양미디어 정보</p>
                <div class="card-btn">단원 보기</div>
            </a>
            
            <!-- 카드 2: 인공지능기초 -->
            <a href="https://comedu-by-y.github.io/study/2level-인기초.html" target="_top" class="subject-card">
                <div class="card-header">
                    <div class="card-icon">⌨️</div>
                    <h2 class="card-title">인공지능기초</h2>
                </div>
                <p class="card-desc">교과서: 2022개정 삼양미디어 인공지능기초</p>
                <div class="card-btn">단원 보기</div>
            </a>

            <!-- 카드 3: 데이터과학과 머신러닝 -->
            <a href="https://sites.google.com/view/your-site/데이터과학과-머신러닝" target="_top" class="subject-card">
                <div class="card-header">
                    <div class="card-icon">🧠</div>
                    <h2 class="card-title">데이터과학과 머신러닝</h2>
                </div>
                <p class="card-desc">교과서: ? </p>
                <div class="card-btn">단원 보기</div>
            </a>

            <!-- 카드 4: 데이터 과학 -->
            <a href="https://sites.google.com/view/your-site/데이터-과학" target="_top" class="subject-card">
                <div class="card-header">
                    <div class="card-icon">🌐</div>
                    <h2 class="card-title">데이터 과학</h2>
                </div>
                <p class="card-desc">교과서: 2022개정 YBM 데이터 과학</p>
                <div class="card-btn">단원 보기</div>
            </a>

            <!-- 카드 5: 소프트웨어와 생활 -->
            <a href="https://sites.google.com/view/your-site/소프트웨어" target="_top" class="subject-card">
                <div class="card-header">
                    <div class="card-icon">⌨️</div>
                    <h2 class="card-title">소프트웨어와 생활</h2>
                </div>
                <p class="card-desc">교과서: ? </p>
                <div class="card-btn">단원 보기</div>
            </a>

            <!-- 카드 6: 정보과학 -->
            <a href="https://sites.google.com/view/your-site/정보과학" target="_top" class="subject-card">
                <div class="card-header">
                    <div class="card-icon">🖥️</div>
                    <h2 class="card-title">정보과학</h2>
                </div>
                <p class="card-desc">교과서: ? </p>
                <div class="card-btn">단원 보기</div>
            </a>
        </div>
    </div>
    <div id="footer-area"></div>
    <!-- 공통 헤더와 푸터를 빈 상자에 쏙쏙 넣어주는 스크립트 -->
    <script>
        // 1. header.html 파일을 찾아서 header-area 상자에 넣기
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-area').innerHTML = data;
            });

        // 2. footer.html 파일을 찾아서 footer-area 상자에 넣기
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-area').innerHTML = data;
            });
    </script>
</body>
</html>
